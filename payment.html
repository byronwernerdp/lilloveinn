<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment — A Li'l Love Inn</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .simple-page {
      max-width: 700px;
      margin: 80px auto 80px;
      padding: 0 2rem;
      text-align: center;
    }
    .simple-page h1 {
      font-size: 2.8rem;
      letter-spacing: .12em;
      margin-bottom: 1rem;
    }
    .simple-page .lead {
      color: #666;
      margin-bottom: 2.5rem;
      font-size: 1.05rem;
      line-height: 1.7;
    }
    .qr-grid {
      display: flex;
      gap: 2rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .qr-card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 4px 28px rgba(0,0,0,.10);
      padding: 2rem 2rem 1.5rem;
      max-width: 240px;
      width: 100%;
    }
    .qr-card img {
      width: 180px;
      height: 180px;
      object-fit: contain;
      border-radius: 8px;
      display: block;
      margin: 0 auto;
    }
    .qr-label {
      margin-top: 1rem;
      font-size: 1rem;
      color: #333;
      font-weight: 600;
    }
    .qr-sub {
      font-size: .88rem;
      color: #888;
      margin-top: .2rem;
      margin-bottom: 1rem;
    }
    .pay-btn {
      display: inline-block;
      padding: .6rem 1.5rem;
      color: #fff;
      border-radius: 6px;
      text-decoration: none;
      font-size: .9rem;
      font-weight: 600;
      letter-spacing: .05em;
    }
    .pay-btn:hover { opacity: .85; }
    .venmo-blue { background: #008CFF; }
    .paypal-blue { background: #003087; }
  </style>
</head>
<body>
  <nav class="site-nav">
    <a href="index.html" class="nav-logo">
      <img src="images/Logo_JPG2.jpg" alt="A Li'l Love Inn" style="height:60px;width:auto;">
    </a>
    <button class="nav-toggle" aria-label="Menu">&#9776;</button>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="mom-pops.html">Mom &amp; Pops</a></li>
      <li><a href="lil-love-inn.html">Li'l Love Inn</a></li>
      <li><a href="the-castle.html">The Castle</a></li>
      <li><a href="the-vision.html">The Vision</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="inquire.html">Inquire</a></li>
    </ul>
  </nav>

  <div class="simple-page">
    <h1>PAYMENT OPTIONS</h1>
    <p class="lead">Scan with your phone camera or click a button below to pay.</p>

    <div class="qr-grid">
      <div class="qr-card">
        <img src="images/Screenshot+2024-05-09+at+10.05.50+AM.jpeg" alt="Venmo QR Code — Amy Werner">
        <p class="qr-label">Venmo</p>
        <p class="qr-sub">@ALilLoveInn</p>
        <a href="https://venmo.com/ALilLoveInn" target="_blank" rel="noopener" class="pay-btn venmo-blue">Pay on Venmo</a>
      </div>
      <div class="qr-card">
        <img src="images/Screenshot+2024-05-09+at+10.04.09%E2%80%AFAM.png" alt="PayPal QR Code — Amy Muckinhaupt">
        <p class="qr-label">PayPal</p>
        <p class="qr-sub">Amy Muckinhaupt</p>
        <a href="https://paypal.me/AmyMuckinhaupt" target="_blank" rel="noopener" class="pay-btn paypal-blue">Pay on PayPal</a>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <a href="inquire.html" class="btn">INQUIRE</a>
    <div class="footer-socials">
      <a href="https://www.facebook.com/lilloveinn" target="_blank">Facebook</a>
      <a href="https://www.instagram.com/lilloveinn" target="_blank">Instagram</a>
    </div>
  </footer>
  <script src="js/main.js"></script>
</body>
</html>
